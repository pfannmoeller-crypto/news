name: Drive-Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install gdown
        run: pip install --quiet gdown

      - name: Show gdown version and options
        run: |
          gdown --version || true
          gdown --help || true

      - name: Download the public inbox folder
        run: |
          gdown --folder -O inbox \
            "https://drive.google.com/drive/folders/1cFGIyPjVUthXbyYT7My9zk6reHgyOeOZ" || echo "gdown exited non-zero"

      - name: Report what arrived
        run: |
          echo "=========== RESULT ==========="
          if [ -d inbox ]; then
            echo "Folder downloaded. Contents:"
            ls -la inbox
            echo "--- hallo.txt ---"
            cat inbox/hallo.txt 2>/dev/null && echo "" || echo "hallo.txt NOT FOUND"
          else
            echo "FAILED - no folder downloaded"
            echo "--- what is in the working dir ---"
            ls -la
          fi
          echo "=============================="
